<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Konversi File — ubah format file langsung di browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#f4f7f5;
    --panel:#ffffff;
    --panel-soft:#f8faf9;
    --ink:#17231e;
    --muted:#66756d;
    --line:#dfe7e2;
    --accent:#176b52;
    --accent-2:#0f513e;
    --accent-soft:#e8f4ef;
    --amber:#d79a32;
    --danger:#b33b3b;
    --shadow:0 18px 50px rgba(20,45,35,.08);
    --shadow-sm:0 7px 22px rgba(20,45,35,.07);
    --radius:16px;
    --mono:'IBM Plex Mono',monospace;
    --sans:'IBM Plex Sans',sans-serif;
    --display:'Fraunces',serif;
  }

  *{box-sizing:border-box}

  html{scroll-behavior:smooth}

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 0%, rgba(23,107,82,.08), transparent 30rem),
      radial-gradient(circle at 100% 20%, rgba(215,154,50,.07), transparent 24rem),
      var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
  }

  .wrap{
    width:min(1120px,calc(100% - 40px));
    margin:0 auto;
    padding:42px 0 72px;
  }

  header.top{
    position:relative;
    padding:30px 34px 28px;
    margin-bottom:28px;
    border:1px solid var(--line);
    border-radius:22px;
    background:rgba(255,255,255,.82);
    box-shadow:var(--shadow-sm);
    overflow:hidden;
  }

  header.top::after{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    right:-70px;
    top:-95px;
    border-radius:50%;
    background:var(--accent-soft);
    pointer-events:none;
  }

  header.top h1{
    position:relative;
    z-index:1;
    margin:0;
    font-family:var(--display);
    font-weight:600;
    font-size:clamp(32px,4vw,46px);
    line-height:1;
    letter-spacing:-.035em;
  }

  header.top p{
    position:relative;
    z-index:1;
    max-width:650px;
    margin:12px 0 0;
    color:var(--muted);
    font-size:15px;
    line-height:1.65;
  }

  header.top .privacy{
    position:relative;
    z-index:1;
    display:inline-flex;
    align-items:center;
    gap:9px;
    margin-top:18px;
    padding:8px 12px;
    border:1px solid #cfe5db;
    border-radius:999px;
    background:#f3faf7;
    color:var(--accent-2);
    font-size:12.5px;
    font-weight:500;
  }

  header.top .privacy .dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:#27a477;
    box-shadow:0 0 0 4px rgba(39,164,119,.12);
  }

  .layout{
    display:grid;
    grid-template-columns:250px minmax(0,1fr);
    gap:24px;
    align-items:start;
  }

  nav.rail{
    position:sticky;
    top:24px;
    display:flex;
    flex-direction:column;
    gap:6px;
    padding:12px;
    border:1px solid var(--line);
    border-radius:18px;
    background:rgba(255,255,255,.82);
    box-shadow:var(--shadow-sm);
  }

  nav.rail::before{
    content:"TOOLS";
    padding:7px 10px 8px;
    color:#87958e;
    font-size:10px;
    font-weight:600;
    letter-spacing:.14em;
  }

  nav.rail button{
    position:relative;
    display:flex;
    align-items:center;
    gap:11px;
    width:100%;
    min-height:44px;
    padding:10px 12px;
    border:1px solid transparent;
    border-radius:11px;
    background:transparent;
    color:var(--muted);
    text-align:left;
    font-family:var(--sans);
    font-size:14px;
    cursor:pointer;
    transition:background .18s ease,color .18s ease,border-color .18s ease,transform .18s ease;
  }

  nav.rail button:hover{
    background:#f4f8f6;
    color:var(--ink);
    transform:translateX(2px);
  }

  nav.rail button.active{
    border-color:#cce4d9;
    background:var(--accent-soft);
    color:var(--accent-2);
    font-weight:600;
  }

  nav.rail button .tick{
    width:4px;
    height:8px;
    flex:none;
    border-radius:999px;
    background:#d8e1dc;
    transition:background .18s ease,height .18s ease;
  }

  nav.rail button.active .tick{
    height:22px;
    background:var(--amber);
  }

  main.panel{
    min-height:520px;
    padding:38px;
    border:1px solid var(--line);
    border-radius:20px;
    background:var(--panel);
    box-shadow:var(--shadow);
  }

  main.panel h2{
    margin:0;
    font-family:var(--display);
    font-size:30px;
    font-weight:600;
    line-height:1.15;
    letter-spacing:-.025em;
  }

  main.panel .sub{
    margin:8px 0 28px;
    color:var(--muted);
    font-size:14px;
    line-height:1.65;
  }

  .dropzone{
    position:relative;
    min-height:190px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:34px 24px;
    border:1.5px dashed #c9d7d0;
    border-radius:16px;
    background:
      linear-gradient(180deg,#fbfdfc,#f7faf8);
    text-align:center;
    cursor:pointer;
    transition:border-color .2s ease,background .2s ease,box-shadow .2s ease,transform .2s ease;
  }

  .dropzone::before{
    content:"↥";
    display:flex;
    align-items:center;
    justify-content:center;
    width:48px;
    height:48px;
    margin-bottom:13px;
    border:1px solid #cce4d9;
    border-radius:14px;
    background:#eaf6f0;
    color:var(--accent);
    font-size:23px;
    font-weight:600;
  }

  .dropzone:hover,
  .dropzone.over{
    border-color:var(--accent);
    background:#f2faf6;
    box-shadow:0 12px 30px rgba(23,107,82,.09);
    transform:translateY(-1px);
  }

  .dropzone input[type=file]{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
  }

  .dropzone .hint{
    margin:0;
    color:var(--ink);
    font-size:14px;
    font-weight:600;
  }

  .dropzone .hint::after{
    content:"  •  atau seret & lepas";
    color:var(--muted);
    font-weight:400;
  }

  .dropzone .filename{
    max-width:90%;
    margin:8px 0 0;
    color:var(--accent-2);
    font-family:var(--mono);
    font-size:12px;
    line-height:1.5;
    word-break:break-all;
  }

  .options{
    display:flex;
    gap:14px;
    flex-wrap:wrap;
    margin-top:20px;
  }

  .options > div{
    min-width:190px;
  }

  .options label{
    display:block;
    margin:0 0 7px;
    color:var(--muted);
    font-size:12px;
    font-weight:600;
  }

  .options select{
    width:100%;
    min-height:42px;
    padding:9px 36px 9px 12px;
    border:1px solid var(--line);
    border-radius:10px;
    outline:none;
    background:#fff;
    color:var(--ink);
    font-family:var(--sans);
    font-size:13.5px;
    cursor:pointer;
    transition:border-color .18s,box-shadow .18s;
  }

  .options select:focus{
    border-color:#9ccab8;
    box-shadow:0 0 0 4px rgba(23,107,82,.09);
  }

  button.action{
    min-height:44px;
    margin-top:22px;
    padding:11px 20px;
    border:0;
    border-radius:10px;
    background:var(--accent);
    color:#fff;
    font-family:var(--sans);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    box-shadow:0 7px 18px rgba(23,107,82,.18);
    transition:background .18s,transform .18s,box-shadow .18s;
  }

  button.action:not(:disabled):hover{
    background:var(--accent-2);
    transform:translateY(-1px);
    box-shadow:0 10px 24px rgba(23,107,82,.22);
  }

  button.action:not(:disabled):active{transform:translateY(0)}

  button.action:disabled{
    background:#c6d0ca;
    color:#f8faf9;
    cursor:not-allowed;
    box-shadow:none;
  }

  .status{
    min-height:20px;
    margin:15px 0 0;
    color:var(--muted);
    font-size:13px;
  }

  .status.err{
    color:var(--danger);
    font-weight:500;
  }

  a.download{
    display:inline-flex;
    align-items:center;
    gap:9px;
    min-height:44px;
    margin-top:15px;
    padding:10px 17px;
    border:1px solid #b7d9cc;
    border-radius:10px;
    background:#f1faf6;
    color:var(--accent-2);
    font-size:14px;
    font-weight:600;
    text-decoration:none;
    transition:background .18s,color .18s,transform .18s;
  }

  a.download::before{
    content:"↓";
    font-size:17px;
  }

  a.download:hover{
    background:var(--accent);
    color:#fff;
    transform:translateY(-1px);
  }

  .note{
    margin-top:28px;
    padding:15px 16px;
    border:1px solid #e3e9e5;
    border-radius:11px;
    background:var(--panel-soft);
    color:var(--muted);
    font-size:12px;
    line-height:1.6;
  }

  @media (max-width:860px){
    .layout{grid-template-columns:190px minmax(0,1fr);gap:18px}
    main.panel{padding:28px}
  }

  @media (max-width:700px){
    .wrap{
      width:min(100% - 24px,560px);
      padding:20px 0 44px;
    }

    header.top{
      padding:25px 22px 23px;
      border-radius:18px;
      margin-bottom:16px;
    }

    header.top h1{font-size:34px}

    .layout{grid-template-columns:1fr}

    nav.rail{
      position:static;
      display:flex;
      flex-direction:row;
      overflow-x:auto;
      padding:8px;
      border-radius:14px;
      scrollbar-width:none;
    }

    nav.rail::-webkit-scrollbar{display:none}

    nav.rail::before{display:none}

    nav.rail button{
      width:auto;
      min-width:max-content;
      min-height:40px;
      padding:8px 11px;
    }

    nav.rail button:hover{transform:none}

    nav.rail button .tick{display:none}

    main.panel{
      min-height:0;
      padding:24px 20px;
      border-radius:16px;
    }

    main.panel h2{font-size:26px}

    .dropzone{
      min-height:175px;
      padding:28px 16px;
    }
  }

  @media (max-width:420px){
    .wrap{width:min(100% - 18px,560px)}
    header.top{padding:22px 18px}
    header.top .privacy{align-items:flex-start;border-radius:12px}
    main.panel{padding:22px 16px}
    .options > div{min-width:100%;width:100%}
    button.action{width:100%}
  }
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Konversi File</h1>
    <p>PDF, Word, gambar, dan spreadsheet — ubah formatnya tanpa mengunggah ke server mana pun.</p>
    <div class="privacy"><span class="dot"></span>Semua konversi diproses langsung di browser kamu, filenya tidak pernah dikirim ke server.</div>
  </header>
  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main class="panel" id="panel"></main>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const tools = [
  { key:"gambar", title:"Gambar ke gambar" },
  { key:"gambar-pdf", title:"Gambar ke PDF" },
  { key:"pdf-gambar", title:"PDF ke gambar" },
  { key:"word-pdf", title:"Word ke PDF" },
  { key:"pdf-word", title:"PDF ke Word" },
  { key:"word-teks", title:"Word ke teks" },
  { key:"sheet", title:"Excel ke CSV / CSV ke Excel" },
];

let state = { tool: "gambar", file: null, files: null };

const rail = document.getElementById("rail");
function renderNav(){
  rail.innerHTML = "";
  tools.forEach(t=>{
    const btn = document.createElement("button");
    btn.className = t.key === state.tool ? "active" : "";
    btn.innerHTML = `<span class="tick"></span><span>${t.title}</span>`;
    btn.addEventListener("click", ()=>{ state.tool = t.key; state.file=null; state.files=null; renderNav(); renderPanel(); });
    rail.appendChild(btn);
  });
}

function baseName(name){ return name.replace(/\.[^.]+$/, ""); }
function ext(name){ const m = name.match(/\.([^.]+)$/); return m ? m[1].toLowerCase() : ""; }

function makeDropzone(accept, multiple, onFiles){
  const id = "drop_" + Math.random().toString(36).slice(2);
  const html = `
    <div class="dropzone" id="${id}">
      <input type="file" id="${id}_input" accept="${accept}" ${multiple?"multiple":""}>
      <p class="hint">Klik atau seret file ke sini</p>
      <p class="filename" id="${id}_name"></p>
    </div>`;
  setTimeout(()=>{
    const zone = document.getElementById(id);
    const input = document.getElementById(id+"_input");
    const nameEl = document.getElementById(id+"_name");
    input.addEventListener("change", ()=>{
      if (input.files.length){
        nameEl.textContent = multiple ? `${input.files.length} file dipilih` : input.files[0].name;
        onFiles(multiple ? Array.from(input.files) : input.files[0]);
      }
    });
    ["dragover","dragenter"].forEach(ev=> zone.addEventListener(ev, e=>{ e.preventDefault(); zone.classList.add("over"); }));
    ["dragleave","drop"].forEach(ev=> zone.addEventListener(ev, e=>{ e.preventDefault(); zone.classList.remove("over"); }));
    zone.addEventListener("drop", e=>{
      const dtFiles = Array.from(e.dataTransfer.files);
      if (dtFiles.length){
        input.files = e.dataTransfer.files;
        nameEl.textContent = multiple ? `${dtFiles.length} file dipilih` : dtFiles[0].name;
        onFiles(multiple ? dtFiles : dtFiles[0]);
      }
    });
  }, 0);
  return html;
}

function downloadLink(blob, filename, label){
  const url = URL.createObjectURL(blob);
  return `<a class="download" href="${url}" download="${filename}">${label || ("Unduh " + filename)}</a>`;
}

const panel = document.getElementById("panel");

function renderPanel(){
  const key = state.tool;
  if (key==="gambar") renderImageConvert();
  else if (key==="gambar-pdf") renderImagesToPdf();
  else if (key==="pdf-gambar") renderPdfToImages();
  else if (key==="word-pdf") renderWordToPdf();
  else if (key==="pdf-word") renderPdfToWord();
  else if (key==="word-teks") renderWordToText();
  else if (key==="sheet") renderSheetConvert();
}

/* ---------------- 1. Gambar ke gambar ---------------- */
function renderImageConvert(){
  panel.innerHTML = `
    <h2>Gambar ke gambar</h2>
    <p class="sub">Ubah format PNG, JPG, atau WEBP. Berlaku untuk satu file.</p>
    ${makeDropzone("image/*", false, f=>{ state.file=f; refresh(); })}
    <div class="options">
      <div><label>Format tujuan</label>
        <select id="fmt">
          <option value="image/png">PNG</option>
          <option value="image/jpeg">JPG</option>
          <option value="image/webp">WEBP</option>
        </select>
      </div>
    </div>
    <button class="action" id="go" disabled>Konversi</button>
    <p class="status" id="status"></p>
    <div id="result"></div>
    <p class="note">Format keluaran terbatas pada PNG/JPG/WEBP karena itu yang didukung langsung oleh browser.</p>
  `;
  const go = panel.querySelector("#go");
  function refresh(){ go.disabled = !state.file; }
  go.addEventListener("click", async ()=>{
    const status = panel.querySelector("#status");
    status.textContent = "Memproses…"; status.className="status";
    try{
      const mime = panel.querySelector("#fmt").value;
      const img = new Image();
      const url = URL.createObjectURL(state.file);
      await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=url; });
      const canvas = document.createElement("canvas");
      canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
      canvas.getContext("2d").drawImage(img,0,0);
      canvas.toBlob(blob=>{
        if (!blob){ status.textContent="Gagal mengonversi gambar ini."; status.className="status err"; return; }
        const extMap = {"image/png":"png","image/jpeg":"jpg","image/webp":"webp"};
        const filename = baseName(state.file.name) + "." + extMap[mime];
        panel.querySelector("#result").innerHTML = downloadLink(blob, filename);
        status.textContent = "Selesai.";
      }, mime, 0.92);
    }catch(e){ status.textContent="Gagal memuat gambar ini."; status.className="status err"; }
  });
}

/* ---------------- 2. Gambar ke PDF ---------------- */
function renderImagesToPdf(){
  panel.innerHTML = `
    <h2>Gambar ke PDF</h2>
    <p class="sub">Pilih beberapa gambar sekaligus — tiap gambar jadi satu halaman, urut sesuai pemilihan.</p>
    ${makeDropzone("image/*", true, fs=>{ state.files=fs; refresh(); })}
    <button class="action" id="go" disabled>Konversi ke PDF</button>
    <p class="status" id="status"></p>
    <div id="result"></div>
  `;
  const go = panel.querySelector("#go");
  function refresh(){ go.disabled = !(state.files && state.files.length); }
  go.addEventListener("click", async ()=>{
    const status = panel.querySelector("#status");
    status.textContent = "Menyusun halaman…"; status.className="status";
    try{
      const { jsPDF } = window.jspdf;
      let doc = null;
      for (let i=0;i<state.files.length;i++){
        const f = state.files[i];
        const img = new Image();
        const u = URL.createObjectURL(f);
        await new Promise((res,rej)=>{ img.onload=res; img.onerror=rej; img.src=u; });
        const w = img.naturalWidth, h = img.naturalHeight;
        if (!doc) doc = new jsPDF({ unit:"px", format:[w,h] });
        else doc.addPage([w,h]);
        const type = f.type.includes("png") ? "PNG" : "JPEG";
        doc.addImage(img, type, 0, 0, w, h);
      }
      const blob = doc.output("blob");
      panel.querySelector("#result").innerHTML = downloadLink(blob, "gambar.pdf");
      status.textContent = "Selesai.";
    }catch(e){ status.textContent="Gagal membuat PDF dari gambar ini."; status.className="status err"; }
  });
}

/* ---------------- 3. PDF ke gambar ---------------- */
function renderPdfToImages(){
  panel.innerHTML = `
    <h2>PDF ke gambar</h2>
    <p class="sub">Tiap halaman PDF diubah jadi PNG, lalu dibungkus dalam satu file ZIP.</p>
    ${makeDropzone("application/pdf", false, f=>{ state.file=f; refresh(); })}
    <button class="action" id="go" disabled>Konversi</button>
    <p class="status" id="status"></p>
    <div id="result"></div>
  `;
  const go = panel.querySelector("#go");
  function refresh(){ go.disabled = !state.file; }
  go.addEventListener("click", async ()=>{
    const status = panel.querySelector("#status");
    status.className="status";
    try{
      const buf = await state.file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      const zip = new JSZip();
      for (let p=1;p<=pdf.numPages;p++){
        status.textContent = `Merender halaman ${p} dari ${pdf.numPages}…`;
        const page = await pdf.getPage(p);
        const viewport = page.getViewport({scale:2});
        const canvas = document.createElement("canvas");
        canvas.width = viewport.width; canvas.height = viewport.height;
        await page.render({canvasContext:canvas.getContext("2d"), viewport}).promise;
        const blob = await new Promise(res=>canvas.toBlob(res, "image/png"));
        zip.file(`halaman-${String(p).padStart(2,"0")}.png`, blob);
      }
      status.textContent = "Menyusun ZIP…";
      const zipBlob = await zip.generateAsync({type:"blob"});
      panel.querySelector("#result").innerHTML = downloadLink(zipBlob, baseName(state.file.name)+"-gambar.zip");
      status.textContent = "Selesai.";
    }catch(e){ status.textContent="Gagal membaca PDF ini."; status.className="status err"; }
  });
}

/* ---------------- 4. Word ke PDF ---------------- */
function renderWordToPdf(){
  panel.innerHTML = `
    <h2>Word ke PDF</h2>
    <p class="sub">Mengambil isi dokumen .docx (teks, judul, daftar) lalu menatanya ulang sebagai PDF.</p>
    ${makeDropzone(".docx", false, f=>{ state.file=f; refresh(); })}
    <button class="action" id="go" disabled>Konversi ke PDF</button>
    <p class="status" id="status"></p>
    <div id="result"></div>
    <p class="note">Hasil PDF berupa render visual dari isi dokumen; format kompleks seperti kolom ganda atau objek gambar tersemat mungkin tidak sama persis dengan aslinya.</p>
  `;
  const go = panel.querySelector("#go");
  function refresh(){ go.disabled = !state.file; }
  go.addEventListener("click", async ()=>{
    const status = panel.querySelector("#status");
    status.textContent = "Membaca dokumen…"; status.className="status";
    try{
      const buf = await state.file.arrayBuffer();
      const result = await mammoth.convertToHtml({arrayBuffer: buf});
      const holder = document.createElement("div");
      holder.style.cssText = "position:fixed;left:-9999px;top:0;width:700px;padding:20px;font-family:Arial,sans-serif;font-size:13px;line-height:1.5;color:#111;";
      holder.innerHTML = result.value;
      document.body.appendChild(holder);
      status.textContent = "Menata halaman PDF…";
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({unit:"pt", format:"a4"});
      await doc.html(holder, {
        x:30, y:30, width:535, windowWidth:700,
        callback: function(doc){
          document.body.removeChild(holder);
          const blob = doc.output("blob");
          panel.querySelector("#result").innerHTML = downloadLink(blob, baseName(state.file.name)+".pdf");
          status.textContent = "Selesai.";
        }
      });
    }catch(e){ status.textContent="Gagal mengonversi dokumen ini."; status.className="status err"; }
  });
}

/* ---------------- 5. PDF ke Word ---------------- */
function renderPdfToWord(){
  panel.innerHTML = `
    <h2>PDF ke Word</h2>
    <p class="sub">Mengekstrak teks dari PDF menjadi dokumen .docx yang bisa dibuka dan diedit di Word.</p>
    ${makeDropzone("application/pdf", false, f=>{ state.file=f; refresh(); })}
    <button class="action" id="go" disabled>Konversi ke Word</button>
    <p class="status" id="status"></p>
    <div id="result"></div>
    <p class="note">Hanya teks yang diambil — tata letak, tabel, gambar, dan pemformatan asli PDF tidak ikut disalin.</p>
  `;
  const go = panel.querySelector("#go");
  function refresh(){ go.disabled = !state.file; }
  go.addEventListener("click", async ()=>{
    const status = panel.querySelector("#status");
    status.className="status";
    try{
      const buf = await state.file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({data:buf}).promise;
      let paragraphsXml = "";
      for (let p=1;p<=pdf.numPages;p++){
        status.textContent = `Mengekstrak teks halaman ${p} dari ${pdf.numPages}…`;
        const page = await pdf.getPage(p);
        const content = await page.getTextContent();
        const lines = {};
        content.items.forEach(item=>{
          const y = Math.round(item.transform[5]);
          if (!lines[y]) lines[y] = [];
          lines[y].push(item.str);
        });
        const orderedY = Object.keys(lines).map(Number).sort((a,b)=>b-a);
        orderedY.forEach(y=>{
          const text = lines[y].join(" ").trim();
          if (text) paragraphsXml += `<w:p><w:r><w:t xml:space="preserve">${escapeXml(text)}</w:t></w:r></w:p>`;
        });
        if (p < pdf.numPages) paragraphsXml += `<w:p><w:r><w:br w:type="page"/></w:r></w:p>`;
      }
      if (!paragraphsXml) paragraphsXml = `<w:p><w:r><w:t>(Tidak ada teks yang bisa diekstrak dari PDF ini — kemungkinan berupa hasil pindaian gambar.)</w:t></w:r></w:p>`;

      status.textContent = "Menyusun file .docx…";
      const docXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>${paragraphsXml}<w:sectPr/></w:body>
</w:document>`;
      const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>
</Types>`;
      const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

      const zip = new JSZip();
      zip.file("[Content_Types].xml", contentTypes);
      zip.folder("_rels").file(".rels", rels);
      zip.folder("word").file("document.xml", docXml);
      const blob = await zip.generateAsync({type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
      panel.querySelector("#result").innerHTML = downloadLink(blob, baseName(state.file.name)+".docx");
      status.textContent = "Selesai.";
    }catch(e){ status.textContent="Gagal membaca PDF ini."; status.className="status err"; }
  });
}
function escapeXml(s){
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&apos;");
}

/* ---------------- 6. Word ke teks ---------------- */
function renderWordToText(){
  panel.innerHTML = `

    <p class="sub">Mengambil seluruh teks polos dari dokumen .docx, tanpa pemformatan.</p>

/* ---------------- 7. Excel <-> CSV ---------------- */
function renderSheetConvert(){
  panel.innerHTML = `
    <h2>Excel ke CSV / CSV ke Excel</h2>
    <p class="sub">Unggah .xlsx untuk diubah ke .csv, atau .csv untuk diubah ke .xlsx. Hanya sheet pertama yang dipakai.</p>
    ${makeDropzone(".xlsx,.xls,.csv", false, f=>{ state.file=f; refresh(); })}
    <button class="action" id="go" disabled>Konversi</button>
    <p class="status" id="status"></p>
    <div id="result"></div>
  `;
  const go = panel.querySelector("#go");
  function refresh(){ go.disabled = !state.file; }
  go.addEventListener("click", async ()=>{
    const status = panel.querySelector("#status");
    status.textContent = "Memproses…"; status.className="status";
    try{
      const e = ext(state.file.name);
      if (e === "csv"){
        const text = await state.file.text();
        const wb = XLSX.read(text, {type:"string"});
        const out = XLSX.write(wb, {bookType:"xlsx", type:"array"});
        const blob = new Blob([out], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
        panel.querySelector("#result").innerHTML = downloadLink(blob, baseName(state.file.name)+".xlsx");
      } else {
        const buf = await state.file.arrayBuffer();
        const wb = XLSX.read(buf, {type:"array"});
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const csv = XLSX.utils.sheet_to_csv(sheet);
        const blob = new Blob([csv], {type:"text/csv"});
        panel.querySelector("#result").innerHTML = downloadLink(blob, baseName(state.file.name)+".csv");
      }
      status.textContent = "Selesai.";
    }catch(err){ status.textContent="Gagal membaca file ini."; status.className="status err"; }
  });
}
